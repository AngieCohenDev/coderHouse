<!doctype html>
<html lang="es">

            type="button"
            data-bs-toggle="drawer"
            data-bs-target="#navbarNavMenu"
            aria-controls="navbarNavMenu"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon" aria-hidden="true"></span>
          </button>
          <dialog
            class="drawer drawer-end"
            tabindex="-1"
            id="navbarNavMenu"
            aria-labelledby="navbarNavMenuLabel"
          >
            <div class="drawer-header">
              <h5 class="drawer-title" id="navbarNavMenuLabel">Menu</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="drawer"
                aria-label="Close"
              ></button>
            </div>
            <div class="drawer-body">
              <ul class="navbar-nav">

                <li class="nav-item">

                <li class="nav-item">

                <li class="nav-item">

        </div>

        <h2 class="section-title" id="titulo-camisas">Camisas</h2>

        <div class="merch-gallery">
          <figure class="featured-figure">
            <img
              class="merch-image"
              src="../img/mercancia/merch1.jpg"
              alt="Camisetas One Ok Rock"

            <figcaption class="image-caption">Precio: 25 USD</figcaption>

          <figure class="featured-figure">
            <img
              class="merch-image"
              src="../img/mercancia/merch2.jpg"
              alt="Camisetas One Ok Rock"
            />
            <figcaption class="image-caption">Precio: 30 USD</figcaption>

          <figure class="featured-figure">
            <img
              class="merch-image"
              src="../img/mercancia/merch3.jpg"
              alt="Camisetas One Ok Rock"
            />
            <figcaption class="image-caption">Precio: 35 USD</figcaption>

          <figure class="featured-figure">
            <img
              class="merch-image"
              src="../img/mercancia/merch4.jpg"
              alt="Camisetas One Ok Rock"
            />
            <figcaption class="image-caption">Precio: 15 USD</figcaption>
